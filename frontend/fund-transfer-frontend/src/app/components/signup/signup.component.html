<div class="card-wrapper">
  <div class="icon-circle"></div>
  <div class="card-header">
    <h2>Create Account</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
    <label>Account Holder Name</label>
    <input formControlName="holderName" type="text" placeholder="Enter your full name" />
    <div class="error" *ngIf="holderName?.touched && holderName?.invalid">Name is required</div>

    <label>Username</label>
    <input formControlName="username" type="text" placeholder="Enter your username" />
    <div class="error" *ngIf="username?.touched && username?.invalid">Username is required</div>

    <label>Password</label>
    <input formControlName="password" type="password" placeholder="Enter your password" />
    <div class="error" *ngIf="password?.touched && password?.invalid">
      <span *ngIf="password?.errors?.['required']">Password is required</span>
      <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
    </div>

    <button type="submit" [disabled]="loading">{{ loading ? 'Creating Account...' : 'Sign Up' }}</button>
  </form>

  <div class="forgot-password">
    <a href="javascript:void(0)" (click)="goToLogin()">Already have an account? Login here</a>
  </div>
</div>
