<div class="history-card">
    <div class="header">
        <button appGoBackDirective class="back-btn">←</button>
        <h1>Transaction History</h1>
    </div>

    <div class="content">
        <div class="filter-pills">
            <button [class.active]="filter() === 'All'" (click)="setFilter('All')">All</button>
            <button [class.active]="filter() === 'Sent'" (click)="setFilter('Sent')">Sent</button>
            <button [class.active]="filter() === 'Received'" (click)="setFilter('Received')">Received</button>
        </div>

        <div class="transaction-list">
            <div class="transaction-item" *ngFor="let t of filteredTransactions">
                <div class="transaction-icon" [class.sent]="t.fromAccountId === this.accountStore.getAccount()!.id"
                    [class.received]="t.toAccountId === this.accountStore.getAccount()!.id">
                    {{ t.fromAccountId === this.accountStore.getAccount()!.id ? '↑' : '↓' }}
                </div>
                <div class="transaction-details">
                    <div class="transaction-name">{{ t.fromAccountId === this.accountStore.getAccount()!.id ? 'Sent to '
                        + t.toAccountId : 'Received from ' + t.fromAccountId }}</div>
                    <div class="transaction-date">{{ t.createdOn }}</div>
                </div>
                <div class="transaction-amount-status">
                    <div class="amount" [class.negative]="t.fromAccountId === this.accountStore.getAccount()!.id"
                        [class.positive]="t.toAccountId === this.accountStore.getAccount()!.id">
                        {{ t.amount }}
                    </div>
                    <div class="status">{{ t.status }}</div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" routerLink="/dashboard">
            <div class="nav-icon">🏠</div>
            <span>Home</span>
        </div>
        <div class="nav-item" routerLink="/transfer">
            <div class="nav-icon">💸</div>
            <span>Transfer</span>
        </div>
        <div class="nav-item active" routerLink="/transaction-history">
            <div class="nav-icon">📜</div>
            <span>History</span>
        </div>
    </div>
</div>
