<div class="icon-circle"></div>
<div class="card-header">
  <h2>Admin Console</h2>
  <button class="logout-btn" (click)="logout()">Logout</button>
</div>

<form [formGroup]="form" (ngSubmit)="submit()" class="query-form">
  <label>Enter Query</label>
  <textarea formControlName="query" placeholder="e.g. who has 0 acc balance" rows="4"></textarea>

  <div class="button-group">
    <button type="submit" [disabled]="loading" class="run-btn">
      {{ loading ? 'Running Query...' : 'Run Query' }}
    </button>

    
  </div>
</form>

<!-- Error message display -->
<div *ngIf="errorMessage" class="error-alert">
  <strong>Error:</strong> {{ errorMessage }}
</div>

<!-- Results appear only when Display Result is clicked -->
 <!--<div class="result-area" *ngIf="result !== null && !errorMessage">-->

<div class="result-area" *ngIf="showResult && result !== null && !errorMessage">
  <h3 class="result-header">Response</h3>

  <div class="table-container">
    <!-- If array of objects, render as table -->
    <table *ngIf="Array.isArray(result) && result.length > 0 && columns.length > 0" class="result-table">
      <thead>
        <tr>
          <th *ngFor="let c of columns">{{ c }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of result">
          <td *ngFor="let c of columns">{{ row[c] }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="Array.isArray(result) && result.length === 0" class="no-result">
    <p>Sorry, I don't find a suitable response.</p>
  </div>
  <div class="table-container">
    <!-- If object (not array), show key/value table -->
    <table *ngIf="!Array.isArray(result) && columns.length > 0" class="result-table">
      <thead>
        <tr>
          <th>Key</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let k of columns">
          <td>{{ k }}</td>
          <td>{{ result[k] }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Always show raw JSON as fallback -->
  <div
  *ngIf="
    !(Array.isArray(result) && result.length > 0 && columns.length > 0)
    && !(!Array.isArray(result) && columns.length > 0)
    && !(Array.isArray(result) && result.length === 0)
  "
  class="json-fallback">

    <p><strong>Raw Response:</strong></p>
    <pre>{{ result | json }}</pre>
  </div>
</div>
