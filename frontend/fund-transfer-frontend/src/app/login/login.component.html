<div class="login-container">
  <div class="header-bar px-3 d-flex align-items-center justify-content-between">
    <div class="header-content d-flex align-items-left">
        
      <span class="header-title">Login Screen</span>
      
    </div>
  </div>
  
  <div class="login-page">
    <div class="card">
      <div class="icon-circle"></div>
      <div class="card-header">
        <h2>Welcome Back</h2>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <label>Username</label>
        <input formControlName="username" type="text" placeholder="Enter your username" />
        <div class="error" *ngIf="username?.touched && username?.invalid">Username is required</div>

        <label>Password</label>
        <input formControlName="password" type="password" placeholder="Enter your password" />
        <div class="error" *ngIf="password?.touched && password?.invalid">Password is required</div>

        <div *ngIf="errorMessage" class="alert">{{ errorMessage }}</div>

        <button type="submit" [disabled]="loading">{{ loading ? 'Logging in...' : 'Login' }}</button>
      </form>
      
      <div class="forgot-password">
        <a href="#">Forgot password?</a>
      </div>
    </div>
  </div>
</div>
